<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>같이가개 — TourAPI 연결 진단</title>
<style>
  body { font-family: "Malgun Gothic", sans-serif; max-width: 860px; margin: 30px auto; padding: 0 16px; color: #1D2939; }
  h1 { color: #1C60EF; font-size: 22px; }
  p { font-size: 14px; color: #667085; }
  button { background: #1C60EF; color: #fff; border: none; border-radius: 8px; padding: 10px 18px; font-size: 14px; cursor: pointer; }
  table { border-collapse: collapse; width: 100%; margin-top: 16px; font-size: 13px; }
  th, td { border: 1px solid #E4E7EC; padding: 7px 10px; text-align: left; word-break: break-all; }
  th { background: #DBE8FE; }
  .ok { color: #067647; font-weight: 700; }
  .fail { color: #B42318; }
  pre { background: #F4F8FF; border: 1px solid #DBE8FE; border-radius: 8px; padding: 12px; font-size: 12px; overflow-x: auto; }
</style>
</head>
<body>
<h1>🔧 TourAPI 연결 진단 (팀원용 QA 도구)</h1>
<p>공공데이터포털 키를 Netlify 환경변수 <code>TOURAPI_KEY</code>에 등록한 뒤, 아래 버튼을 누르면
어떤 엔드포인트 조합이 정상 동작하는지 자동으로 검사합니다.<br>
검사 후 <b>OK</b>가 하나라도 있으면 본 서비스(index.html)가 실데이터로 동작합니다.</p>
<button id="run">진단 시작</button>
<button id="sampleCall" style="background:#12B76A;">실데이터 샘플 조회 (서울 · 식당)</button>
<button id="extraCall" style="background:#7A5AF8;">추가 공공데이터 점검 (문화시설·동물병원)</button>
<button id="aiCall" style="background:#111;">AI 도우미 점검 (Gemini)</button>
<div id="out"></div>
<script src="js/apitest.js"></script>
</body>
</html>
